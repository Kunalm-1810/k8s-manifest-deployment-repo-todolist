apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: global-collector
  namespace: observability
spec:
  mode: deployment
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch:
    exporters:
      logging:
        verbosity: detailed
        loglevel: debug
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "otelcol"
        
      prometheusremotewrite:
        endpoint: "http://prometheus-stack-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [logging] 
          
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus] 