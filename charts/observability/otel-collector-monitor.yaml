apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: otel-collector-podmonitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: global-collector-collector
  namespaceSelector:
    matchNames:
      - observability
  podMetricsEndpoints:
    - port: prometheus
      interval: 15s
      path: /metrics