{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: fe-vpa
  namespace: {{ .Values.namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fe-deployment

  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources:
          - memory

  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
{{- end }}