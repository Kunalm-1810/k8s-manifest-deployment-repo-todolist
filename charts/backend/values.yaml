replicaCount: 2
image:
  repository: kunalmane/mern-backend
  tag: "v41"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 5000
  targetPort: 5000
ingress:
  host: todolist.kodetechm.com
  certificateArn: "arn:aws:acm:ap-south-1:106940013645:certificate/2a10a659-aba5-4232-a204-eff0a284631a"
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilization: 60
namespace: production
secretName: backend-secret
configMapName: be-config
secret:
  MONGO_URI: mongodb://mongo:27017/todolist
  port: "5000"
