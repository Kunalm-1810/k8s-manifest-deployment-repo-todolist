replicaCount: 2
image:
  repository: kunalmane/mern-backend
  tag: "v15"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 5000
  targetPort: 5000
ingress:
  host: todolist.kodetechm.com
  certificateArn: "arn:aws:acm:ap-south-1:106940013645:certificate/8930c901-0be8-41a0-8401-4e16e3937baa"    # add aws arn acm certificate
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilization: 60
namespace: production
secretName: backend-secret
configMapName: be-config
secret:
  MONGO_URI: mongodb://mongo-headless:27017/todolist
  port: "5000"
