apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: mongo
spec:
  clusterIP: {{ .Values.service.type }}
  selector:
    app: mongo
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: mongo-port